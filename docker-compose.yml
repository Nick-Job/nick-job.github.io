services:
  downloader:
    build: ./downloader
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:8123}"
      DOWNLOAD_API_TOKEN: "${DOWNLOAD_API_TOKEN:-}"
      MAX_FILESIZE_MB: "512"
      YTDLP_PROXY: "${YTDLP_PROXY:-}"
      # Mount a cookies.txt file and set this path only when a platform requires login.
      # YTDLP_COOKIES_FILE: "/data/cookies.txt"
